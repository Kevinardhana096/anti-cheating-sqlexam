<!DOCTYPE html>
<html lang="id" data-theme="dracula">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waiting Room - Ujian Praktikum Basis Data</title>
    <script>(function(){var t=localStorage.getItem("exam_global_theme")||"dracula";document.documentElement.setAttribute("data-theme",t);})()</script>
    <link rel="stylesheet" href="/static/css/style.css?v=20261101_v5">
    <style>
        .wr-root{min-height:100vh;display:grid;grid-template-rows:auto 1fr;background-color:var(--bg-app);}
        .wr-body{max-width:980px;margin:0 auto;width:100%;padding:2rem 1.5rem;overflow-y:auto;}
        .wr-main{display:flex;flex-direction:column;gap:1.5rem;}
        .wr-status-card{background-color:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:2.5rem 2rem 2rem;text-align:center;position:relative;overflow:hidden;}
        .wr-status-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--primary),var(--accent));}
        .wr-pulse-ring{display:inline-flex;align-items:center;justify-content:center;width:72px;height:72px;border-radius:50%;background-color:color-mix(in srgb,var(--warning) 12%,transparent);border:2px solid var(--warning);margin-bottom:1rem;animation:pulse-ring 2s ease-in-out infinite;}
        .wr-pulse-ring.active{background-color:color-mix(in srgb,var(--success) 14%,transparent);border-color:var(--success);animation:none;}
        @keyframes pulse-ring{0%,100%{transform:scale(1);box-shadow:0 0 0 0 color-mix(in srgb,var(--warning) 30%,transparent);}50%{transform:scale(1.06);box-shadow:0 0 0 10px color-mix(in srgb,var(--warning) 0%,transparent);}}
        .wr-status-title{font-size:1.4rem;font-weight:700;color:var(--text-main);margin-bottom:.5rem;}
        .wr-status-desc{color:var(--text-muted);font-size:.9rem;max-width:540px;margin:0 auto 1.25rem;line-height:1.55;}
        .wr-dot-loader{display:inline-flex;gap:5px;margin-top:1rem;align-items:center;justify-content:center;}
        .wr-dot-loader span{width:7px;height:7px;border-radius:50%;background-color:var(--warning);animation:dot-bounce 1.2s ease-in-out infinite;}
        .wr-dot-loader span:nth-child(2){animation-delay:.2s;}.wr-dot-loader span:nth-child(3){animation-delay:.4s;}
        @keyframes dot-bounce{0%,80%,100%{transform:translateY(0);opacity:.5;}40%{transform:translateY(-7px);opacity:1;}}
        .wr-section-title{font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);margin-bottom:.85rem;display:flex;align-items:center;gap:.5rem;}
        .wr-count-badge{background-color:var(--bg-surface-elevated);color:var(--text-main);font-size:.7rem;font-weight:700;padding:.1rem .45rem;border-radius:999px;border:1px solid var(--border-subtle);min-width:22px;text-align:center;}
        .wr-participants-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.75rem;}
        .wr-participant-card{background-color:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:.85rem 1rem;display:flex;align-items:center;gap:.75rem;transition:border-color .2s ease;animation:card-appear .3s ease-out;}
        .wr-participant-card.is-me{border-color:var(--accent);background-color:color-mix(in srgb,var(--accent) 8%,var(--bg-surface));}
        @keyframes card-appear{from{opacity:0;transform:scale(.93);}to{opacity:1;transform:scale(1);}}
        .wr-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;flex-shrink:0;background-color:var(--bg-surface-elevated);color:var(--accent);border:1px solid var(--border-subtle);}
        .wr-participant-info{min-width:0;}
        .wr-participant-name{font-size:.82rem;font-weight:600;color:var(--text-main);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .wr-participant-nim{font-size:.7rem;color:var(--text-muted);font-family:var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .wr-empty-state{color:var(--text-subtle);font-size:.85rem;padding:.5rem 0;}
        .wr-start-banner{display:none;position:fixed;inset:0;background-color:rgba(0,0,0,.78);z-index:2000;align-items:center;justify-content:center;flex-direction:column;}
        .wr-start-banner.visible{display:flex;animation:fadeIn .3s ease-out;}
        @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
        .wr-start-card{background-color:var(--bg-surface);border:2px solid var(--success);border-radius:var(--radius-lg);padding:2.5rem 3rem;box-shadow:0 0 60px color-mix(in srgb,var(--success) 22%,transparent);max-width:380px;text-align:center;}
        .wr-start-icon-wrap{width:72px;height:72px;border-radius:50%;background-color:color-mix(in srgb,var(--success) 14%,transparent);border:2px solid var(--success);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;}
        .wr-start-title{font-size:1.5rem;font-weight:700;color:var(--success);margin-bottom:.4rem;}
        .wr-start-desc{color:var(--text-muted);font-size:.9rem;margin-bottom:1.25rem;}
        .wr-countdown{font-size:2.5rem;font-weight:700;color:var(--text-main);font-family:var(--font-mono);}
    </style>
</head>

<svg xmlns="http://www.w3.org/2000/svg" style="display:none;">
    <symbol id="icon-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></symbol>
    <symbol id="icon-check-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></symbol>
    <symbol id="icon-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
    <symbol id="icon-book-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></symbol>
    <symbol id="icon-palette" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></symbol>
    <symbol id="icon-log-out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></symbol>
</svg>

<body data-nim="{{ user.nim }}" data-token="{{ user.session_token }}">
<div class="wr-root">
    <header class="app-header">
        <div class="brand-wrapper">
            <span class="brand-logo-badge">EXAM IDE</span>
            <div class="brand-title">Ujian Praktikum Basis Data</div>
        </div>
        <div class="header-meta">
            <div class="user-tag">
                <span>NIM: <strong>{{ user.nim }}</strong></span>
                <span style="color:var(--text-subtle);">|</span>
                <span>{{ user.name }}</span>
            </div>
            <div class="global-theme-switcher" title="Ganti tema tampilan">
                <span class="global-theme-icon">
                    <svg width="14" height="14" style="display:inline-block;vertical-align:middle;"><use href="#icon-palette"/></svg>
                    Theme
                </span>
                <select id="global-theme-select" class="global-theme-select" aria-label="Pilih Tema">
                    <option value="dracula">Dracula</option>
                    <option value="monokai">Monokai</option>
                    <option value="nord">Nord</option>
                    <option value="material">Material Darker</option>
                    <option value="gruvbox">Gruvbox Dark</option>
                    <option value="solarized">Solarized Dark</option>
                    <option value="ayu">Ayu Dark</option>
                    <option value="light">Light Mode</option>
                </select>
            </div>
            <a href="/logout" class="btn btn-secondary btn-sm header-action">
                <svg width="13" height="13" style="display:inline-block;vertical-align:middle;margin-right:4px;"><use href="#icon-log-out"/></svg>
                Keluar
            </a>
        </div>
    </header>

    <div class="wr-body">
        <main class="wr-main">
            <div class="wr-status-card">
                <div class="wr-pulse-ring" id="wr-pulse-ring">
                    <svg width="30" height="30" style="color:var(--warning);"><use href="#icon-clock"/></svg>
                </div>
                <div class="wr-status-title" id="wr-status-title">Menunggu Ujian Dimulai</div>
                <p class="wr-status-desc" id="wr-status-desc">Dosen/pengawas belum membuka lembar soal. Harap tunggu dan jangan tutup halaman ini.</p>
                <div class="wr-dot-loader" id="wr-dot-loader">
                    <span></span><span></span><span></span>
                </div>
            </div>
            <div>
                <div class="wr-section-title">
                    <svg width="14" height="14" style="display:inline-block;color:var(--text-muted);vertical-align:middle;"><use href="#icon-users"/></svg>
                    Peserta di Waiting Room
                    <span class="wr-count-badge" id="wr-participant-count">0</span>
                </div>
                <div class="wr-participants-grid" id="wr-participants-grid"></div>
            </div>
        </main>
    </div>
</div>

<div class="wr-start-banner" id="wr-start-banner" role="alert" aria-live="assertive">
    <div class="wr-start-card">
        <div class="wr-start-icon-wrap">
            <svg width="36" height="36" style="color:var(--success);"><use href="#icon-book-open"/></svg>
        </div>
        <div class="wr-start-title">Ujian Dimulai!</div>
        <p class="wr-start-desc">Dosen telah membuka lembar soal. Bersiaplah!</p>
        <div class="wr-countdown" id="wr-countdown">3</div>
    </div>
</div>

<script>
(function(){
    var THEME_KEY="exam_global_theme";
    function applyTheme(t){document.documentElement.setAttribute("data-theme",t);var s=document.getElementById("global-theme-select");if(s)s.value=t;}
    applyTheme(localStorage.getItem(THEME_KEY)||"dracula");
    var sel=document.getElementById("global-theme-select");
    if(sel)sel.addEventListener("change",function(){applyTheme(sel.value);localStorage.setItem(THEME_KEY,sel.value);});

    var MY_NIM = document.body.dataset.nim || "";
    var examStarted = false;
    var statePollTimer = null;
    var partPollTimer = null;
    var hbTimer = null;

    function escHtml(str){
        return String(str || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    function renderParticipants(list){
        var grid = document.getElementById("wr-participants-grid");
        var countEl = document.getElementById("wr-participant-count");
        if (!grid) return;
        if (countEl) countEl.textContent = list.length;

        var newNims = new Set(list.map(function(p){ return p.nim; }));
        Array.from(grid.querySelectorAll(".wr-participant-card")).forEach(function(el){
            if (!newNims.has(el.dataset.nim)) el.remove();
        });

        var existingNims = new Set(Array.from(grid.querySelectorAll(".wr-participant-card")).map(function(el){ return el.dataset.nim; }));
        list.forEach(function(p){
            if (!existingNims.has(p.nim)) grid.appendChild(buildCard(p));
        });

        var empty = grid.querySelector(".wr-empty-state");
        if (list.length === 0){
            if (!empty){
                var el = document.createElement("div");
                el.className = "wr-empty-state";
                el.textContent = "Belum ada peserta lain.";
                grid.appendChild(el);
            }
        } else {
            if (empty) empty.remove();
        }
    }

    function buildCard(p){
        var isMe = p.nim === MY_NIM;
        var initial = (p.name || "?").charAt(0).toUpperCase();
        var card = document.createElement("div");
        card.className = "wr-participant-card" + (isMe ? " is-me" : "");
        card.dataset.nim = p.nim;
        card.innerHTML = '<div class="wr-avatar">' + initial + '</div>'
            + '<div class="wr-participant-info">'
            + '<div class="wr-participant-name">' + escHtml(p.name) + (isMe ? ' <span style="color:var(--accent);font-size:.65rem;font-weight:700;">(Anda)</span>' : '') + '</div>'
            + '<div class="wr-participant-nim">' + escHtml(p.nim) + '</div>'
            + '</div>';
        return card;
    }

    function triggerExamStart(){
        if (examStarted) return;
        examStarted = true;
        clearInterval(statePollTimer);
        clearInterval(partPollTimer);
        clearInterval(hbTimer);

        var ring = document.getElementById("wr-pulse-ring");
        var title = document.getElementById("wr-status-title");
        var desc = document.getElementById("wr-status-desc");
        var loader = document.getElementById("wr-dot-loader");
        if (ring){
            ring.classList.add("active");
            ring.innerHTML = '<svg width="30" height="30" style="color:var(--success);"><use href="#icon-check-circle"/></svg>';
        }
        if (title) title.textContent = "Ujian Dimulai!";
        if (desc) desc.textContent = "Lembar soal sedang dibuka...";
        if (loader) loader.remove();

        var banner = document.getElementById("wr-start-banner");
        var countdown = document.getElementById("wr-countdown");
        if (banner) banner.classList.add("visible");

        var n = 3;
        var tick = setInterval(function(){
            n--;
            if (countdown) countdown.textContent = n;
            if (n <= 0){
                clearInterval(tick);
                window.location.href = "/exam";
            }
        }, 1000);
    }

    // Lightweight polling mechanisms
    async function checkExamState(){
        if (examStarted) return;
        try {
            var r = await fetch("/api/exam/state");
            if (r.ok){
                var d = await r.json();
                if (d.state === "active"){
                    triggerExamStart();
                }
            }
        } catch (_) {}
    }

    async function pollParticipants(){
        if (examStarted) return;
        try {
            var r = await fetch("/api/waiting/participants");
            if (r.ok){
                var d = await r.json();
                renderParticipants(d.participants || []);
            }
        } catch (_) {}
    }

    async function sendHeartbeat(){
        if (examStarted) return;
        try {
            await fetch("/api/waiting/heartbeat", { method: "POST" });
        } catch (_) {}
    }

    // Execute immediately
    checkExamState();
    pollParticipants();
    sendHeartbeat();

    // Setup recurring intervals
    statePollTimer = setInterval(checkExamState, 3000);
    partPollTimer = setInterval(pollParticipants, 6000);
    hbTimer = setInterval(sendHeartbeat, 15000);
})();
</script>
</body>
</html>
